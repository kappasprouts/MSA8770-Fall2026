# Riverview State University is fictional. These policies are for the MSA 8770
# prototype and must not be presented as an actual university's requirements.
schema_version: 1
institution: Riverview State University
policy_version: "1.0"
published_on: "2026-09-29"
simulation_scope: "Apply to all supplied synthetic applicant packets regardless of their historical application cycle."
document_types:
  official_transcript: "An official academic transcript from an issuing institution."
  personal_statement: "The applicant's essay or personal statement; humans read it, but the AI does not."
  recommendation_letter: "A letter submitted by a recommender."
  english_proficiency_evidence: "Approved English-proficiency evidence or a documented waiver."
  credential_evaluation: "A recognized evaluation of non-U.S. academic records."
status_codes:
  READY_FOR_HUMAN_REVIEW: "Automated checks completed; an officer must review the file."
  INCOMPLETE: "A required item is absent; request the item and pause substantive review."
  COUNSELOR_REVIEW: "An ambiguity, conflict, waiver, or exception requires a person."
  REPLACEMENT_REQUESTED: "A document cannot be read; request a legible replacement."
  STOPPED: "Automated processing cannot continue safely."
status_priority:
  - STOPPED
  - COUNSELOR_REVIEW
  - REPLACEMENT_REQUESTED
  - INCOMPLETE
  - READY_FOR_HUMAN_REVIEW
interpretation:
  - "A rule fires only when its applicability is supported by applicant evidence; unknown applicability goes to counselor review."
  - "A missing required document is incomplete; a present but unreadable document follows POL-READ-01."
  - "One packet can have several findings. Preserve every finding and its evidence even when the highest-priority status is displayed."
  - "The status codes are workflow states, not admit, deny, or waitlist decisions."
  - "A human verifies whether a transcript is official, a waiver is documented, or an evaluation is recognized."

policies:
  - id: POL-FT-01
    title: First-Year Core Materials
    origin: team
    applies_to: First-Year applicants
    rule: "An official transcript, essay, and one recommendation are required. Test scores are optional."
    system_action: "Incomplete if a required item is missing."
    operation:
      type: required_documents
      application_type: first_year
      documents: [official_transcript, personal_statement, recommendation_letter]
      on_missing: INCOMPLETE

  - id: POL-TR-01
    title: Transfer Core Materials
    origin: team
    applies_to: Transfer applicants
    rule: "Official transcripts from all attended institutions and a personal statement are required. A recommendation is not required."
    system_action: "Incomplete if a required transcript or statement is missing."
    operation:
      type: required_documents
      application_type: transfer
      documents: [official_transcript_from_each_attended_institution, personal_statement]
      on_missing: INCOMPLETE
      on_unknown_institution_list: COUNSELOR_REVIEW

  - id: POL-INT-01
    title: English Proficiency
    origin: team
    applies_to: Applicants educated in a non-English curriculum
    rule: "Approved English-proficiency evidence is required unless a documented waiver applies."
    system_action: "Incomplete when evidence is missing; route waiver requests to a counselor."
    operation:
      type: conditional_document
      when: {education_language: non_english}
      document: english_proficiency_evidence
      exception: documented_waiver
      on_missing: INCOMPLETE
      on_waiver_request: COUNSELOR_REVIEW

  - id: POL-INT-02
    title: International Credential Evaluation
    origin: team
    applies_to: Applicants with international education
    rule: "A recognized credential evaluation is required for non-U.S. academic records."
    system_action: "Incomplete when the evaluation is missing."
    operation:
      type: conditional_document
      when: {non_us_academic_record: true}
      document: credential_evaluation
      on_missing: INCOMPLETE
      on_recognition_uncertain: COUNSELOR_REVIEW

  - id: POL-DUP-01
    title: Duplicate Documents
    origin: team
    applies_to: All applicants
    rule: "When duplicate versions conflict or cannot be identified as authoritative, staff must review both versions."
    system_action: "Route to counselor review; do not discard automatically."
    operation:
      type: review_flag
      flags: [conflicting_duplicate, authority_unclear]
      on_flag: COUNSELOR_REVIEW

  - id: POL-DATE-01
    title: Date Consistency
    origin: team
    applies_to: All applicants
    rule: "Document issue dates and attendance dates must be chronologically consistent with the application record."
    system_action: "Route inconsistent or impossible dates to counselor review."
    operation:
      type: review_flag
      flags: [impossible_date, inconsistent_attendance_date, inconsistent_issue_date]
      on_flag: COUNSELOR_REVIEW

  - id: POL-COURSE-01
    title: Coursework Interpretation
    origin: team
    applies_to: All applicants
    rule: "Prerequisite coursework must be identifiable from course titles, credits, or supporting documentation."
    system_action: "Route ambiguous coursework to counselor review."
    operation:
      type: review_flag
      flags: [ambiguous_prerequisite_coursework]
      on_flag: COUNSELOR_REVIEW
      note: "This policy does not create a new prerequisite or an automatic eligibility threshold."

  - id: POL-READ-01
    title: Unreadable Attachments
    origin: team
    applies_to: All applicants
    rule: "Documents must be legible enough to verify identity, dates, grades, and issuing institution."
    system_action: "Request a replacement or route to counselor review."
    operation:
      type: review_flag
      flags: [unreadable_required_document, unreadable_optional_document]
      on_unreadable_required_document: REPLACEMENT_REQUESTED
      on_unreadable_optional_document: COUNSELOR_REVIEW

  - id: POL-EXC-01
    title: Nonstandard Exceptions
    origin: team
    applies_to: All applicants
    rule: "Cases outside published standard rules must not be decided automatically."
    system_action: "Stop automated processing and route to counselor review."
    operation:
      type: review_flag
      flags: [nonstandard_exception]
      on_flag: STOPPED
      handoff: COUNSELOR_REVIEW

  - id: POL-TEST-01
    title: Test-Optional Review
    origin: team
    applies_to: First-Year applicants
    rule: "SAT or ACT scores are optional for standard application completeness."
    system_action: "Do not mark incomplete solely because a test score is absent."
    operation:
      type: non_requirement
      application_type: first_year
      document: standardized_test_score
      on_missing: READY_FOR_HUMAN_REVIEW

  - id: POL-ID-01
    title: Applicant and Document Matching
    origin: added_for_prototype
    applies_to: All applicants
    rule: "A document must be linked to the correct applicant using its applicant ID and available identifying details. Conflicts must be resolved before the document is used as evidence."
    system_action: "Route mismatched or uncertain documents to counselor review; do not merge packets automatically."
    operation:
      type: review_flag
      flags: [applicant_id_mismatch, document_owner_uncertain]
      on_flag: COUNSELOR_REVIEW

  - id: POL-EVID-01
    title: Evidence and Unknown Values
    origin: added_for_prototype
    applies_to: All applicants
    rule: "Every factual review finding must cite its source document or policy section. Missing, unreadable, or unsupported facts must be labeled unknown rather than inferred."
    system_action: "Reject unsupported findings from the review draft and route unresolved material facts to human review."
    operation:
      type: output_validation
      require_source_reference: true
      unknown_label: unknown
      on_unsupported_material_finding: COUNSELOR_REVIEW

  - id: POL-AP-01
    title: Academic Opportunity Context
    origin: added_for_prototype
    applies_to: First-Year applicants
    rule: "Interpret AP participation against the high school's offered courses and four-year AP cap. A school with no AP offerings must not be treated as a lack of student rigor. AP course grades are not AP exam scores."
    system_action: "Show school context in the dossier; mark unavailable AP exam performance unknown and leave academic judgment to the officer."
    operation:
      type: review_guidance
      context_source: high_school_profile
      no_ap_offerings_meaning: no_opportunity
      missing_ap_exam_score: unknown
      automatic_academic_decision: false

  - id: POL-ESSAY-01
    title: Personal Statement Human Review
    origin: added_for_prototype
    applies_to: All applicants
    rule: "The system may check whether a personal statement is present, but only an admissions officer may read and evaluate its content."
    system_action: "Exclude personal-statement content from model prompts, retrieval indexes, and AI-generated evaluations; send it to the human review queue."
    operation:
      type: processing_boundary
      document: personal_statement
      allow_presence_check: true
      allow_model_content_access: false
      human_review_required: true

  - id: POL-HUMAN-01
    title: Human Admissions Authority
    origin: added_for_prototype
    applies_to: All applicants
    rule: "AI findings and workflow statuses are advisory. An authorized admissions officer makes and records every final admit, deny, or waitlist decision after reviewing the application and cited evidence."
    system_action: "Stop at READY_FOR_HUMAN_REVIEW or an exception handoff; never write a final admissions decision automatically."
    operation:
      type: decision_boundary
      final_decision_actor: authorized_admissions_officer
      automatic_final_decision: false
